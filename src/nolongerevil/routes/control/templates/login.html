<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in · No Longer Evil</title>
  <link rel="icon" type="image/png" href="/nle-favicon.png">
  <style>
    :root { --accent:#0EA5E9; --accent-hover:#0284C7; --accent-text:#fff; --bg:#f8fafc; --card:#fff; --text:#0f172a; --text2:#475569; --border:#e2e8f0; --error:#dc2626; }
    @media (prefers-color-scheme: dark) {
      :root { --accent:#38BDF8; --accent-hover:#0EA5E9; --accent-text:#0f172a; --bg:#0f172a; --card:#1e293b; --text:#f1f5f9; --text2:#94a3b8; --border:#334155; --error:#f87171; }
    }
    * { box-sizing: border-box; margin: 0; }
    [hidden] { display: none !important; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; }
    form { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 28px 24px; width: 100%; max-width: 340px; display: flex; flex-direction: column; gap: 14px; }
    h1 { font-size: 20px; display: flex; align-items: center; gap: 10px; }
    h1 img { width: 28px; height: 28px; }
    p { font-size: 13px; color: var(--text2); line-height: 1.5; }
    label { font-size: 13px; color: var(--text2); display: flex; flex-direction: column; gap: 6px; }
    label.check { flex-direction: row; align-items: center; gap: 8px; }
    input[type=password] { font: inherit; font-size: 15px; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--text); }
    button { font: inherit; font-size: 15px; font-weight: 600; padding: 10px; border: none; border-radius: 8px; background: var(--accent); color: var(--accent-text); cursor: pointer; }
    button:hover { background: var(--accent-hover); }
    button:disabled { opacity: .6; cursor: default; }
    #error { color: var(--error); font-size: 13px; min-height: 1em; }
  </style>
</head>
<body>
  <form id="form">
    <h1><img src="/nle-icon.png" alt="">No Longer Evil</h1>
    <p id="intro">Sign in to the control panel.</p>
    <label>Password <input type="password" id="password" autocomplete="current-password" required autofocus></label>
    <label id="confirmRow" hidden>Repeat password <input type="password" id="confirm" autocomplete="new-password"></label>
    <label class="check"><input type="checkbox" id="remember" checked> Remember this device</label>
    <button id="submit">Sign in</button>
    <div id="error" role="alert"></div>
  </form>
  <script>
    const setup = location.pathname === '/setup';
    const code = new URLSearchParams(location.search).get('code') || '';
    const $ = id => document.getElementById(id);
    if (setup) {
      $('intro').textContent = 'Choose a password for the control panel (at least 8 characters). You will use it to sign in on other devices.';
      $('password').autocomplete = 'new-password';
      $('confirmRow').hidden = false;
      $('confirm').required = true;
      $('submit').textContent = 'Set password';
      history.replaceState(null, '', '/setup');  // keep the one-time code out of the history
    }
    $('form').addEventListener('submit', async e => {
      e.preventDefault();
      $('error').textContent = '';
      if (setup && $('password').value !== $('confirm').value) {
        $('error').textContent = 'The passwords do not match.';
        return;
      }
      $('submit').disabled = true;
      try {
        const r = await fetch(location.pathname, {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({password: $('password').value, remember: $('remember').checked, code}),
        });
        if (r.ok) { location.href = '/'; return; }
        $('error').textContent = (await r.json()).error || 'Sign-in failed.';
      } catch {
        $('error').textContent = 'Could not reach the server.';
      }
      $('submit').disabled = false;
    });
  </script>
</body>
</html>
