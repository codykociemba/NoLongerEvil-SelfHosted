services:
  nolongerevil:
    build: .
    container_name: nolongerevil-server
    restart: unless-stopped
    ports:
      # Device API port
      - "8000:8000"
      # Control API port
      - "8082:8082"
    volumes:
      # Persistent data storage
      - nolongerevil-data:/app/data
      # Optional: SSL certificates
      # - ./certs:/app/certs:ro
    environment:
      # Server configuration
      # Set in .env to this host's LAN IP; the thermostat cannot use localhost
      - API_ORIGIN=${API_ORIGIN:?set API_ORIGIN in .env, e.g. http://192.168.1.50:8000}

      # TLS for the device API (uncomment with the certs volume; API_ORIGIN must use https://)
      # - CERT_DIR=/app/certs

      # Device pairing requirement (default: false)
      # When true, devices must complete entry key pairing before transport access.
      # When false, any device can PUT and subscribe without registration.
      - REQUIRE_DEVICE_PAIRING=false

      # Entry key configuration
      - ENTRY_KEY_TTL_SECONDS=3600

      # Weather configuration
      - WEATHER_CACHE_TTL_MS=600000

      # Subscription configuration
      - MAX_SUBSCRIPTIONS_PER_DEVICE=100
      # SUSPEND_TIME_MAX: Device sleep duration before fallback wake (default 300s, max 350s)
      # Server closes the subscribe connection 10s before this
      # - SUSPEND_TIME_MAX=300
      # DEFER_DEVICE_WINDOW: Delay before device sends PUT after local changes
      # - DEFER_DEVICE_WINDOW=15
      # DISABLE_DEFER_WINDOW: After server push, disable defer for this duration
      # - DISABLE_DEFER_WINDOW=60

      # Debug configuration
      - DEBUG_LOGGING=false
      # - DEBUG_LOGS_DIR=./data/debug-logs
      # - STORE_DEVICE_LOGS=true

      # Database configuration
      - SQLITE3_DB_PATH=/app/data/database.sqlite

      # MQTT configuration (optional)
      # - MQTT_HOST=mqtt-broker
      # - MQTT_PORT=1883
      # - MQTT_USER=
      # - MQTT_PASSWORD=
      # - MQTT_TOPIC_PREFIX=nolongerevil
      # - MQTT_DISCOVERY_PREFIX=homeassistant
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8082/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  nolongerevil-data:
    name: nolongerevil-data
